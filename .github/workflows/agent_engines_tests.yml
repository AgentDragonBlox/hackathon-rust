name: Rust primary demo
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked
      - run: pip install -r requirements.txt
      - run: python -m pytest grid_engine/tests tests -q
      - name: Verify real Rust and Python services
        shell: bash
        run: |
          cargo build --locked
          target/debug/agent_engines > /tmp/agents.log 2>&1 &
          AGENTS_PID=$!
          python -m uvicorn grid_engine.api:app --port 8001 > /tmp/grid.log 2>&1 &
          GRID_PID=$!
          python -m uvicorn orchestrator.main:app --port 8000 > /tmp/orchestrator.log 2>&1 &
          ORCHESTRATOR_PID=$!
          trap 'kill "$AGENTS_PID" "$GRID_PID" "$ORCHESTRATOR_PID"' EXIT
          python scripts/smoke_demo.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
