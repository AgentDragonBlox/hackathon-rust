[package]
name = "agent_engines_rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent_engines"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.10.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# for integration tests that hit the running app in-process, mirroring
# how the Python version's test_api.py uses FastAPI's TestClient
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3