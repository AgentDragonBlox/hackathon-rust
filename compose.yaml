services:
  agents:
    build:
      context: .
      dockerfile: agent_engines_rs/Dockerfile
    ports: ["8002:8002"]
  grid:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports: ["8001:8001"]
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-m", "uvicorn", "orchestrator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GRID_ENGINE_URL: http://grid:8001
      AGENT_ENGINE_URL: http://agents:8002
    depends_on: [agents, grid]
    ports: ["8000:8000"]
